; Thule Moon Academy wave settings (single player). Read by the academy_waves plugin when a match starts.
[waves]
; Replace the bonus-point waves (4, 8, 12, 16, 20) with a copy of the enemy wave before them. 1 = on, 0 = off.
replace_bonus_waves=1
; 1 = every group comes in on its timer without waiting for the previous enemies to die.
keep_going=1
; Multiplies every pause between groups (0.5 = half as long).
delay_scale=0.5
; Each wave gets this much more of its original enemies than the wave before, compounding and rounded down:
; wave N spawns floor(original * (1 + growth) ^ (N - 1)). 0.10 = 10 %.
growth_per_wave=0.10
