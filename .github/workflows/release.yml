# Publishes a release when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0). The tag must match
# VERSION. Tags with a suffix (v0.2.0-beta.1) become pre-releases, which only beta-channel launchers install.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   RELAY_ADDRESS   the relay the launcher uses by default, e.g. relay.example.com:3074
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  launcher:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches VERSION
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -TotalCount 1).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match VERSION ($version)" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Point the launcher at this repository and the relay
        shell: pwsh
        run: |
          $defaults = Get-Content launcher/defaults.ini
          $defaults = $defaults -replace '^update_repo=.*', 'update_repo=${{ github.repository }}'
          if ('${{ vars.RELAY_ADDRESS }}') { $defaults = $defaults -replace '^relay=.*', 'relay=${{ vars.RELAY_ADDRESS }}' }
          Set-Content launcher/defaults.ini $defaults

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build and package
        shell: pwsh
        run: ./tools/release/package.ps1 -RequireInstaller

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = "work/release/AcademyLauncherSetup-$env:VERSION.exe", "work/release/AcademyLauncher-$env:VERSION-portable.zip", "work/release/SHA256SUMS.txt"
          $flags = @("--title", "Academy Launcher $env:VERSION", "--generate-notes")
          if ($env:VERSION -match '-') { $flags += "--prerelease" }
          gh release create "${{ github.ref_name }}" @files @flags

  relay-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push the relay image to GitHub Container Registry
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/academy-relay"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$image:${GITHUB_REF_NAME}" -t "$image:latest" server/relay
          docker push "$image:${GITHUB_REF_NAME}"
          docker push "$image:latest"
