# Academy Launcher defaults, shipped with every release. A player's settings.ini overrides these.
#
# relay: the relay server for online games without port forwarding (server/relay). Set this to your relay's
#        DNS name before the first release, e.g. relay.example.com:3074
relay=relay.example.com:3074
# update_repo: GitHub owner/repository whose Releases provide updates (empty = update checks off)
update_repo=
update_channel=stable
check_updates=1
